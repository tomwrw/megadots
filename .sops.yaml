# .sops.yaml
#
# Bootstrap flow for adding a new host:
#   1. Add a new `- &HOST age1...placeholder` line under `keys:` AND
#      a `- *HOST` reference under the `creation_rules` `age:` list.
#      (The bootstrap recipe sed-replaces the &HOST line value, so the
#      key needs to exist for the sed match to succeed.)
#   2. Run `just deploy HOST` (installs OS, host generates SSH key).
#   3. Run `just bootstrap HOST` (replaces placeholder, rewraps secrets).

keys:
  # Personal age key for user tomwrw (derived from SSH key via ssh-to-age).
  - &tomwrw age180zs35et9c5zljx9k86rusv7dvsft5znghd5fjf42n8umgjsjatq6f2d8m

  # Host age public keys — replaced by `just bootstrap HOST`.
  - &endgame age180zs35et9c5zljx9k86rusv7dvsft5znghd5fjf42n8umgjsjatq6f2d8m
  - &flatmate age180zs35et9c5zljx9k86rusv7dvsft5znghd5fjf42n8umgjsjatq6f2d8m
  - &spectre age1p55868ms2xgemy8syvzyf0sr0k9eqjhte66twlst6kuzpqy26fns4r8up9

creation_rules:
  - path_regex: ^secrets/secrets\.yaml$
    key_groups:
      - age:
          - *tomwrw
          - *endgame
          - *flatmate
          - *spectre
