name: Flake check

# Keep the tree green: format, lint (deadnix + statix) and evaluate every
# host on each push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check --print-build-logs
