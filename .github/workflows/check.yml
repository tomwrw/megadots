name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Evaluation only. No host closure is ever built here: a green 15 GB build
  # proves little that instantiating does not, deploys are atomic, and
  # nixos-rebuild builds before it switches - so a broken closure costs time at
  # the terminal rather than a broken machine.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.treefmt \
            .#checks.x86_64-linux.check-flake-file \
            .#checks.x86_64-linux.secrets

      # Derived, not hardcoded: a hardcoded list means a newly added host is
      # silently never checked. Keyed by system, so an aarch64 host would need
      # its own runner and its own list.
      - id: hosts
        run: |
          hosts=$(nix eval --json '.#nixosConfigurations' --apply builtins.attrNames)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "hosts: $hosts"

      # Forcing toplevel.drvPath evaluates a host's entire module system and
      # writes .drv files without realising a single output, so it costs eval
      # time and nothing else. toplevel is also where nixpkgs runs the tree's
      # own `assertions` - the mem_sleep_default one in
      # aspects/hardware/surface-pro.nix among them - so without this step they
      # would go untested.
      #
      # Stylix reads a base16 scheme out of a derivation, so this does realise
      # one small path by IFD: a plain cache.nixos.org fetch. The CachyOS kernel
      # arrives through an overlay and is never built here, which is why this
      # needs no extra substituter.
      - name: Instantiate every host
        env:
          HOSTS: ${{ steps.hosts.outputs.hosts }}
        run: |
          for host in $(jq -r '.[]' <<<"$HOSTS"); do
            echo "::group::$host"
            nix eval --raw --print-build-logs \
              ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
